[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elc-rl"
version = "0.1.0"
description = "Reproducible data and model utilities for the CGS turntable RL project"
requires-python = ">=3.11"

[project.optional-dependencies]
training = [
    "control>=0.10,<0.11",
    "gymnasium>=1.2,<1.4",
    "numba>=0.66,<0.67",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "stable-baselines3>=2.9,<3",
    "tensorboard>=2.18,<3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
